<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huffman 树动画演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .header { text-align: center; padding: 24px 16px 8px; }
  .header h1 {
    font-size: 28px; font-weight: 700;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header p { color: #9ca3af; margin-top: 6px; font-size: 14px; }

  .tabs {
    display: flex; justify-content: center; gap: 4px;
    margin: 16px auto 0; background: #1e1e2e;
    border-radius: 12px; padding: 4px; width: fit-content;
  }
  .tab {
    padding: 10px 28px; border: none; border-radius: 10px;
    background: transparent; color: #9ca3af;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all .25s;
  }
  .tab.active {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: #fff; box-shadow: 0 2px 12px rgba(99,102,241,.35);
  }
  .tab:hover:not(.active) { color: #e0e0e0; }

  .panel { display: none; max-width: 780px; margin: 20px auto; padding: 0 16px; }
  .panel.active { display: block; }

  .input-group {
    background: #1e1e2e; border-radius: 14px; padding: 20px; margin-bottom: 16px;
  }
  .input-group label {
    display: block; font-size: 13px; color: #9ca3af;
    margin-bottom: 8px; font-weight: 600;
  }
  textarea {
    width: 100%; background: #13131b; border: 1.5px solid #2d2d3f;
    border-radius: 10px; color: #e0e0e0; font-size: 15px;
    padding: 12px 14px; resize: vertical; outline: none;
    transition: border-color .2s; font-family: inherit;
  }
  textarea:focus { border-color: #6366f1; }
  textarea { min-height: 70px; }

  .radio-group {
    display: flex; gap: 18px; margin-top: 14px; align-items: center;
  }
  .radio-group label { font-size: 13px; color: #d1d5db; cursor: pointer; margin-bottom: 0; display: flex; align-items: center; gap: 6px; }
  .radio-group input[type=radio] { accent-color: #6366f1; }

  .btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    padding: 10px 26px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(99,102,241,.35); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-secondary { background: #2d2d3f; color: #d1d5db; }
  .btn-secondary:hover { background: #3a3a50; }
  .btn-step {
    background: linear-gradient(135deg, #059669, #10b981); color: #fff;
  }
  .btn-step:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(16,185,129,.35); }
  .btn-step:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

  .speed-control {
    display: flex; align-items: center; gap: 10px;
    margin-top: 10px; font-size: 13px; color: #9ca3af;
  }
  .speed-control input[type=range] { flex: 1; max-width: 200px; accent-color: #6366f1; }

  .canvas-wrap {
    background: #1e1e2e; border-radius: 14px;
    overflow: hidden; position: relative;
  }
  .canvas-wrap canvas { display: block; width: 100%; }

  .info-bar {
    display: flex; gap: 16px; flex-wrap: wrap;
    margin-top: 14px; font-size: 13px;
  }
  .info-chip {
    background: #1e1e2e; padding: 8px 16px;
    border-radius: 10px; color: #9ca3af;
  }
  .info-chip span { color: #a78bfa; font-weight: 700; }

  .table-wrap {
    background: #1e1e2e; border-radius: 14px;
    padding: 16px; margin-top: 16px; overflow-x: auto; display: none;
  }
  .table-wrap.show { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 8px 12px; color: #9ca3af;
    border-bottom: 1px solid #2d2d3f; font-weight: 600;
  }
  td { padding: 8px 12px; border-bottom: 1px solid #1a1a28; color: #d1d5db; }
  td.code-cell { font-family: 'Fira Code', 'Consolas', monospace; color: #60a5fa; letter-spacing: 1px; }

  .legend {
    display: flex; gap: 18px; margin-top: 10px;
    font-size: 13px; color: #9ca3af; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 14px; height: 14px; border-radius: 50%; }
  .hint { font-size: 12px; color: #6b7280; margin-top: 6px; }
</style>
</head>
<body>

<div class="header">
  <h1>Huffman 树动画演示</h1>
  <p>可视化构建 Huffman 编码树的每一步</p>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab(0)">手动输入权重</button>
  <button class="tab" onclick="switchTab(1)">文本频率模式</button>
</div>

<!-- Mode 0: manual weights -->
<div class="panel active" id="panel0">
  <div class="input-group">
    <label>输入叶子节点权重（用逗号或空格分隔，可选标签如 A:5,B:3）</label>
    <textarea id="manualInput" placeholder="例如: A:5, B:3, C:7, D:2, E:8">A:5, B:3, C:7, D:2, E:8</textarea>
    <p class="hint">格式：标签:权重 或纯数字，用逗号/空格分隔</p>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="btnBuild0" onclick="buildFromManual()">构建 Huffman 树</button>
    <button class="btn btn-step" id="btnStep0" onclick="stepForward()" disabled>单步执行</button>
    <button class="btn btn-secondary" id="btnAuto0" onclick="autoPlay()" disabled>自动播放</button>
    <button class="btn btn-secondary" onclick="resetAll()">重置</button>
  </div>
  <div class="speed-control">
    <span>速度</span>
    <input type="range" id="speedRange" min="1" max="10" value="5">
    <span id="speedLabel">5</span>
  </div>
</div>

<!-- Mode 1: text frequency -->
<div class="panel" id="panel1">
  <div class="input-group">
    <label>输入一段文字（空格将被忽略），按字符频率构建 Huffman 树</label>
    <textarea id="textInput" placeholder="例如: huffman coding is great">huffman coding is great</textarea>
    <div class="radio-group">
      <span style="font-size:13px;color:#9ca3af;font-weight:600;">权重显示：</span>
      <label><input type="radio" name="freqMode" value="count" checked onchange="onFreqModeChange()"> 频次（出现次数）</label>
      <label><input type="radio" name="freqMode" value="freq" onchange="onFreqModeChange()"> 频率（百分比）</label>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="btnBuild1" onclick="buildFromText()">构建 Huffman 树</button>
    <button class="btn btn-step" id="btnStep1" onclick="stepForward()" disabled>单步执行</button>
    <button class="btn btn-secondary" id="btnAuto1" onclick="autoPlay()" disabled>自动播放</button>
    <button class="btn btn-secondary" onclick="resetAll()">重置</button>
  </div>
  <div class="speed-control">
    <span>速度</span>
    <input type="range" id="speedRange2" min="1" max="10" value="5">
    <span id="speedLabel2">5</span>
  </div>
</div>

<div style="max-width:780px;margin:0 auto;padding:0 16px;">
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#60a5fa"></div> 叶子节点</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div> 非叶子节点（合并）</div>
    <div class="legend-item"><div class="legend-dot" style="background:#6366f1"></div> 当前选中</div>
    <div class="legend-item"><div class="legend-dot" style="background:#374151;border:1.5px solid #6b7280"></div> 待处理</div>
  </div>
</div>

<div style="max-width:780px;margin:16px auto 0;padding:0 16px;">
  <div class="canvas-wrap">
    <canvas id="canvas" width="1600" height="900"></canvas>
  </div>
  <div class="info-bar">
    <div class="info-chip">步骤: <span id="infoStep">-</span></div>
    <div class="info-chip">剩余队列大小: <span id="infoQueue">-</span></div>
    <div class="info-chip">总权重: <span id="infoTotal">-</span></div>
  </div>
  <div class="table-wrap" id="codeTable">
    <table>
      <thead><tr><th>字符</th><th>权重</th><th>编码</th><th>码长</th></tr></thead>
      <tbody id="codeBody"></tbody>
    </table>
  </div>
</div>

<script>
// ── Constants ──
const LEAF_COLOR = '#60a5fa';
const LEAF_STROKE = '#93c5fd';
const INTERNAL_COLOR = '#f59e0b';
const INTERNAL_STROKE = '#fbbf24';
const HIGHLIGHT_COLOR = '#6366f1';
const HIGHLIGHT_STROKE = '#818cf8';
const PENDING_COLOR = '#374151';
const PENDING_BORDER = '#6b7280';
const EDGE_COLOR = '#4b5563';
const NODE_R = 22;

// ── State ──
let nodes = [];
let queue = [];
let stepCount = 0;
let totalWeight = 0;
let finished = false;
let autoTimer = null;
let highlightPair = [];
let currentTab = 0;
let textMode = 'count'; // 'count' or 'freq'
let rawFreq = {};       // raw character counts (for freq % calculation)
let totalChars = 0;

// ── Tab ──
function switchTab(idx) {
  currentTab = idx;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  document.querySelectorAll('.panel').forEach((p,i) => p.classList.toggle('active', i===idx));
  resetAll();
}

function onFreqModeChange() {
  textMode = document.querySelector('input[name="freqMode"]:checked').value;
  if (currentTab === 1 && Object.keys(rawFreq).length > 0) {
    rebuildTextItems();
  }
}

// ── Parse ──
function parseManualInput(text) {
  const items = [];
  const parts = text.split(/[,\n]+/).map(s => s.trim()).filter(Boolean);
  for (const p of parts) {
    const m = p.match(/^([A-Za-z0-9一-鿿_]+)\s*:\s*(\d+\.?\d*)$/);
    if (m) {
      items.push({ label: m[1], weight: parseFloat(m[2]) });
    } else {
      const n = parseFloat(p);
      if (!isNaN(n)) items.push({ label: p, weight: n });
    }
  }
  return items;
}

function countChars(text) {
  const freq = {};
  for (const ch of text) {
    if (ch === ' ') continue; // ignore spaces
    freq[ch] = (freq[ch]||0) + 1;
  }
  return freq;
}

function freqToItems(freq) {
  const entries = Object.entries(freq).sort((a,b) => b[1] - a[1]);
  if (textMode === 'freq') {
    const sum = entries.reduce((s,e) => s + e[1], 0);
    return entries.map(([k,v]) => ({ label: k, weight: v, displayWeight: (v / sum * 100).toFixed(1) + '%' }));
  }
  return entries.map(([k,v]) => ({ label: k, weight: v, displayWeight: v }));
}

function rebuildTextItems() {
  const items = freqToItems(rawFreq);
  if (items.length < 2) return;
  initBuild(items);
}

// ── Build ──
function buildFromManual() {
  const items = parseManualInput(document.getElementById('manualInput').value);
  if (items.length < 2) { alert('请至少输入两个节点'); return; }
  rawFreq = {}; totalChars = 0;
  initBuild(items);
}

function buildFromText() {
  const text = document.getElementById('textInput').value;
  if (!text.trim()) { alert('请输入文字'); return; }
  rawFreq = countChars(text);
  totalChars = Object.values(rawFreq).reduce((s,v) => s+v, 0);
  const items = freqToItems(rawFreq);
  if (items.length < 2) { alert('至少需要两种不同字符'); return; }
  initBuild(items);
}

function initBuild(items) {
  resetState();
  nodes = items.map((it, i) => ({
    id: i, label: it.label, weight: it.weight,
    displayWeight: it.displayWeight !== undefined ? it.displayWeight : it.weight,
    left: -1, right: -1, parent: -1, isLeaf: true
  }));
  queue = nodes.map((_, i) => i);
  queue.sort((a,b) => nodes[a].weight - nodes[b].weight || a - b);
  totalWeight = nodes.reduce((s,n) => s + n.weight, 0);
  stepCount = 0;
  finished = false;
  highlightPair = [];

  setStepBtns(true);
  updateInfo();
  draw();
}

function resetState() {
  nodes = []; queue = []; stepCount = 0; totalWeight = 0;
  finished = false; highlightPair = [];
  rawFreq = {}; totalChars = 0;
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  document.getElementById('codeTable').classList.remove('show');
  document.getElementById('codeBody').innerHTML = '';
  setAutoLabel(false);
}

function resetAll() {
  resetState();
  updateInfo();
  draw();
  setStepBtns(false);
}

// ── Step ──
function stepForward() {
  if (finished || queue.length < 2) { finishTree(); return; }

  const a = queue.shift();
  const b = queue.shift();
  highlightPair = [a, b];

  const newNode = {
    id: nodes.length,
    label: '',
    weight: nodes[a].weight + nodes[b].weight,
    displayWeight: nodes[a].weight + nodes[b].weight,
    left: a, right: b, parent: -1, isLeaf: false
  };
  nodes[a].parent = newNode.id;
  nodes[b].parent = newNode.id;
  nodes.push(newNode);

  let inserted = false;
  for (let i = 0; i < queue.length; i++) {
    if (newNode.weight <= nodes[queue[i]].weight) {
      queue.splice(i, 0, newNode.id);
      inserted = true;
      break;
    }
  }
  if (!inserted) queue.push(newNode.id);

  stepCount++;
  updateInfo();
  draw();

  setTimeout(() => { highlightPair = []; draw(); }, 600);
  if (queue.length <= 1) { setTimeout(() => finishTree(), 700); }
}

function finishTree() {
  finished = true;
  setStepBtns(false);
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; setAutoLabel(false); }
  computeCodes();
  draw();
}

// ── Codes ──
function computeCodes() {
  const rootId = queue.length > 0 ? queue[0] : nodes.length - 1;
  const codes = {};
  function traverse(id, path) {
    if (id < 0) return;
    const n = nodes[id];
    if (n.isLeaf) { codes[n.label] = path || '0'; return; }
    traverse(n.left, path + '0');
    traverse(n.right, path + '1');
  }
  traverse(rootId, '');

  const body = document.getElementById('codeBody');
  body.innerHTML = '';
  const leafNodes = nodes.filter(n => n.isLeaf);
  leafNodes.sort((a,b) => codes[a.label].length - codes[b.label].length || a.weight - b.weight);
  for (const lf of leafNodes) {
    const code = codes[lf.label];
    const w = textMode === 'freq' && currentTab === 1
      ? (lf.weight / totalChars * 100).toFixed(1) + '%'
      : lf.weight;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${esc(lf.label)}</td><td>${w}</td><td class="code-cell">${code}</td><td>${code.length}</td>`;
    body.appendChild(tr);
  }
  document.getElementById('codeTable').classList.add('show');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── Auto ──
function autoPlay() {
  if (autoTimer) {
    clearInterval(autoTimer); autoTimer = null; setAutoLabel(false); return;
  }
  if (finished) return;
  const speed = currentTab === 0
    ? parseInt(document.getElementById('speedRange').value)
    : parseInt(document.getElementById('speedRange2').value);
  const interval = 1600 - speed * 140;
  setAutoLabel(true);
  autoTimer = setInterval(() => {
    if (finished) { clearInterval(autoTimer); autoTimer = null; setAutoLabel(false); return; }
    stepForward();
  }, interval);
}

function setAutoLabel(on) {
  const label = on ? '⏸ 暂停' : '▶ 自动播放';
  ['btnAuto0','btnAuto1'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = label;
  });
}

function setStepBtns(enabled) {
  ['btnStep0','btnStep1'].forEach(id => { const el = document.getElementById(id); if(el) el.disabled = !enabled; });
  ['btnAuto0','btnAuto1'].forEach(id => { const el = document.getElementById(id); if(el) el.disabled = !enabled; });
  ['btnBuild0','btnBuild1'].forEach(id => { const el = document.getElementById(id); if(el) el.disabled = enabled; });
}

function updateInfo() {
  document.getElementById('infoStep').textContent = stepCount;
  document.getElementById('infoQueue').textContent = queue.length;
  const dw = textMode === 'freq' && currentTab === 1
    ? '100%'
    : totalWeight;
  document.getElementById('infoTotal').textContent = dw;
}

document.getElementById('speedRange').addEventListener('input', e => document.getElementById('speedLabel').textContent = e.target.value);
document.getElementById('speedRange2').addEventListener('input', e => document.getElementById('speedLabel2').textContent = e.target.value);

// ── Canvas Drawing ──
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Compute subtree width (number of leaves)
function subtreeLeafCount(id) {
  if (id < 0) return 0;
  if (nodes[id].isLeaf) return 1;
  return subtreeLeafCount(nodes[id].left) + subtreeLeafCount(nodes[id].right);
}

// Compute subtree depth
function subtreeDepth(id) {
  if (id < 0 || nodes[id].isLeaf) return 0;
  return 1 + Math.max(subtreeDepth(nodes[id].left), subtreeDepth(nodes[id].right));
}

// Layout a single tree, return positions map and extents
function layoutSingleTree(rootId, cx, cy, allocW, levelH) {
  const positions = {};
  const extents = { minX: cx, maxX: cx };

  function lay(id, x, y, w) {
    if (id < 0) return;
    positions[id] = { x, y };
    const n = nodes[id];
    if (n.isLeaf) return;

    const lCount = subtreeLeafCount(n.left);
    const rCount = subtreeLeafCount(n.right);
    const total = lCount + rCount;

    const gap = 16;
    const lw = (w - gap) * (lCount / total);
    const rw = (w - gap) * (rCount / total);

    let lx = x - gap/2 - lw/2;
    let rx = x + gap/2 + rw/2;

    // Fix collision: ensure left rightmost <= right leftmost
    const leftExt = getSubtreeExtent(n.left, lx, lw);
    const rightExt = getSubtreeExtent(n.right, rx, rw);

    if (leftExt.maxX > rightExt.minX) {
      const shift = (leftExt.maxX - rightExt.minX) / 2 + 4;
      lx -= shift;
      rx += shift;
    }

    lay(n.left, lx, y + levelH, lw);
    lay(n.right, rx, y + levelH, rw);

    extents.minX = Math.min(extents.minX, lx - NODE_R);
    extents.maxX = Math.max(extents.maxX, rx + NODE_R);
  }

  lay(rootId, cx, cy, allocW);
  return { positions, extents };
}

// Get horizontal extent of a subtree centered at cx with width w
function getSubtreeExtent(id, cx, w) {
  if (id < 0) return { minX: cx, maxX: cx };
  const n = nodes[id];
  if (n.isLeaf) return { minX: cx - NODE_R, maxX: cx + NODE_R };

  const lCount = subtreeLeafCount(n.left);
  const rCount = subtreeLeafCount(n.right);
  const total = lCount + rCount;
  const gap = 16;
  const lw = (w - gap) * (lCount / total);
  const rw = (w - gap) * (rCount / total);
  let lx = cx - gap/2 - lw/2;
  let rx = cx + gap/2 + rw/2;

  const leftExt = getSubtreeExtent(n.left, lx, lw);
  const rightExt = getSubtreeExtent(n.right, rx, rw);

  if (leftExt.maxX > rightExt.minX) {
    const shift = (leftExt.maxX - rightExt.minX) / 2 + 4;
    lx -= shift;
    rx += shift;
  }

  const le = getSubtreeExtent(n.left, lx, lw);
  const re = getSubtreeExtent(n.right, rx, rw);
  return { minX: Math.min(cx - NODE_R, le.minX, re.minX), maxX: Math.max(cx + NODE_R, le.maxX, re.maxX) };
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const W = rect.width;
  const H = Math.max(450, W * 0.56);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (nodes.length === 0) {
    ctx.fillStyle = '#4b5563';
    ctx.font = '15px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('点击"构建 Huffman 树"开始', W/2, H/2);
    return;
  }

  // Determine which trees to show (forest during build, single tree when done)
  const rootIds = [];
  if (finished) {
    rootIds.push(queue.length > 0 ? queue[0] : nodes.length - 1);
  } else {
    // Forest: all roots in queue
    for (const qid of queue) {
      if (nodes[qid].parent < 0 || !nodes.some(n => n.id === nodes[qid].parent)) {
        rootIds.push(qid);
      }
    }
    // Actually, roots in queue are exactly the forest roots
    // But we should show all roots that have no parent
    rootIds.length = 0;
    const allIds = new Set(queue);
    for (const qid of queue) rootIds.push(qid);
  }

  // Layout all trees in the forest
  const allPositions = {};
  const treeLayouts = [];
  const TOP_MARGIN = 50;
  const SIDE_MARGIN = 30;
  const TREE_GAP = 40;

  // First pass: compute max depth across all trees to determine levelH
  let maxDepth = 0;
  for (const rid of rootIds) maxDepth = Math.max(maxDepth, subtreeDepth(rid));
  const levelH = Math.min(90, (H - TOP_MARGIN - 40) / (maxDepth + 1));

  // Second pass: layout each tree independently centered at 0
  let totalNeededWidth = 0;
  const treeWidths = [];
  for (const rid of rootIds) {
    const totalLeafW = subtreeLeafCount(rid);
    const allocW = Math.max(totalLeafW * 60, 120);
    const layout = layoutSingleTree(rid, allocW / 2, TOP_MARGIN, allocW, levelH);
    const extW = layout.extents.maxX - layout.extents.minX;
    treeWidths.push(extW);
    treeLayouts.push(layout);
    totalNeededWidth += extW;
  }
  totalNeededWidth += TREE_GAP * Math.max(0, rootIds.length - 1);

  // Compute scale if needed
  const availW = W - SIDE_MARGIN * 2;
  const scale = totalNeededWidth > availW ? availW / totalNeededWidth : 1;

  // Third pass: position trees horizontally
  let curX = SIDE_MARGIN + (availW - totalNeededWidth * scale) / 2;
  for (let i = 0; i < treeLayouts.length; i++) {
    const layout = treeLayouts[i];
    const extW = treeWidths[i] * scale;
    const treeCenter = curX + extW / 2;

    // Original center of this tree's layout
    const origCenter = (layout.extents.minX + layout.extents.maxX) / 2;
    const offsetX = treeCenter - origCenter * scale;

    for (const [id, pos] of Object.entries(layout.positions)) {
      allPositions[id] = {
        x: pos.x * scale + offsetX,
        y: pos.y * scale + TOP_MARGIN
      };
    }
    curX += extW + TREE_GAP * scale;
  }

  // Draw edges
  for (const n of nodes) {
    if (!allPositions[n.id]) continue;
    if (n.left >= 0 && allPositions[n.left]) drawEdge(allPositions[n.id], allPositions[n.left], '0');
    if (n.right >= 0 && allPositions[n.right]) drawEdge(allPositions[n.id], allPositions[n.right], '1');
  }

  // Draw nodes
  for (const n of nodes) {
    if (!allPositions[n.id]) continue;
    const p = allPositions[n.id];
    const isHighlight = highlightPair.includes(n.id);
    const isInQueue = queue.includes(n.id);
    let fill, stroke;

    if (isHighlight) {
      fill = HIGHLIGHT_COLOR; stroke = HIGHLIGHT_STROKE;
    } else if (n.isLeaf) {
      fill = LEAF_COLOR; stroke = LEAF_STROKE;
    } else if (isInQueue || finished) {
      fill = INTERNAL_COLOR; stroke = INTERNAL_STROKE;
    } else {
      fill = PENDING_COLOR; stroke = PENDING_BORDER;
    }

    drawNode(p.x, p.y, n, fill, stroke, isHighlight, scale);
  }
}

function drawEdge(from, to, bit) {
  if (!from || !to) return;
  ctx.beginPath();
  const midY = (from.y + to.y) / 2;
  ctx.moveTo(from.x, from.y + NODE_R);
  ctx.bezierCurveTo(from.x, midY, to.x, midY, to.x, to.y - NODE_R);
  ctx.strokeStyle = EDGE_COLOR;
  ctx.lineWidth = 2;
  ctx.stroke();

  const lx = (from.x + to.x) / 2 + (bit === '0' ? -12 : 12);
  const ly = midY;
  ctx.fillStyle = '#9ca3af';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(bit, lx, ly);
}

function drawNode(x, y, node, fill, stroke, isHighlight, scale) {
  const r = isHighlight ? NODE_R + 4 : NODE_R;

  if (isHighlight) {
    ctx.beginPath();
    ctx.arc(x, y, r + 6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(99,102,241,0.2)';
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';

  const dw = node.displayWeight !== undefined ? node.displayWeight : node.weight;

  if (node.isLeaf) {
    ctx.font = 'bold 14px sans-serif';
    ctx.fillText(node.label, x, y - 6);
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#e0e7ff';
    ctx.fillText(dw, x, y + 10);
  } else {
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(node.weight, x, y);
  }
}

window.addEventListener('resize', draw);
</script>
